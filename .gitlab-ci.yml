# =====================================================================
#  Techno Pôle — Pipeline GitLab CI/CD
#  Construit l'image Docker et la pousse sur le Container Registry GitLab
#  à chaque push sur la branche par défaut (et sur les tags), puis déclenche
#  le déploiement Dokploy.
#
#  Variables CI/CD à définir (Settings → CI/CD → Variables) :
#    DOKPLOY_API_TOKEN    — token d'API Dokploy
#    DOKPLOY_COMPOSE_ID   — id du compose Dokploy de CE projet
# =====================================================================

stages:
  - build
  - deploy

build-image:
  stage: build
  image: docker:26-dind
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # On récupère la dernière image comme source de cache (couches réutilisées)
    - docker pull "$IMAGE_LATEST" || true
    - echo "Build de l'image (avec cache de couches)…"
    - docker build
      --provenance=false
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$IMAGE_LATEST"
      -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
    - echo "Push des images…"
    - docker push "$IMAGE_SHA"
    - docker push "$IMAGE_LATEST"

trigger_dokploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Déclenchement du déploiement Dokploy..."
    - |
      curl -s -w "\nHTTP Status: %{http_code}" \
        -X POST "https://dokploy.ginfo.centrale-med.fr/api/compose.deploy" \
        -H "x-api-key: $DOKPLOY_API_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}"
  only:
    - main
