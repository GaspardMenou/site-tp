# =====================================================================
#  Techno Pôle — GitHub Actions
#  Équivalent GitHub de la CI GitLab : build de l'image Docker et push
#  sur le GitHub Container Registry (ghcr.io) à chaque push sur main / tag.
#  (Le déploiement Dokploy reste sur GitLab ; si tu déploies depuis GitHub,
#   ajoute ici un step de trigger équivalent.)
# =====================================================================

name: build-and-push

on:
  push:
    branches: [main]
    tags: ["*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
