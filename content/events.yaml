# ═══════════════════════════════════════════════════════════════
#  LES PROCHAINES DATES / PRESTAS
#  Édite ce fichier pour ajouter, modifier ou retirer une soirée.
#  Elles s'affichent dans l'ordre de ce fichier. Push → c'est en ligne.
#
#  Champs :
#    date     : la date affichée (ex "13.09")
#    name     : le nom de la soirée
#    asso     : l'asso organisatrice → ajoute son logo (voir la liste en bas)
#    venue    : le lieu / sous-titre
#    status   : le texte du badge (ex "BIENTÔT", "COMPLET", "RSVP")
#    live     : true pour un badge mis en avant (vert acide)
#    lineup   : la liste des DJs (optionnel)
# ═══════════════════════════════════════════════════════════════

- date: "13.09"
  name: WEI 2026
  asso: BDE
  venue: Week-end d'intégration
  status: LINE-UP À VENIR
  live: true
  lineup:
    - Sparco
    - DJ Hyp
    - Bbmix

